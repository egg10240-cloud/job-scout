name: daily-job-scrape

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated dashboard
        run: |
          git config user.name "job-scout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "daily scrape $(date +'%Y-%m-%d')"
          git push
